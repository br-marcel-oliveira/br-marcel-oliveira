name: live-metrics

on:
  schedule:
    - cron: "17 * * * *" # de hora em hora
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-metrics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Saída gerada vive no branch `metrics`, fora do histórico da main.
      - name: Restaurar histórico de uptime
        run: |
          mkdir -p out
          if git fetch --depth=1 origin metrics 2>/dev/null; then
            git show FETCH_HEAD:history.json > out/history.json || true
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Gerar selos de status
        env:
          METRICS_CONFIG: ${{ secrets.METRICS_CONFIG }}
        run: python scripts/live_metrics.py out

      - name: Publicar no branch metrics
        run: |
          cd out
          git init -q -b metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "metrics: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" metrics
