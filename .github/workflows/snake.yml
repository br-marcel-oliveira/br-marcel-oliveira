name: snake

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#8052ff&color_dots=#1a1a1a,#3b2b7a,#5b3fc4,#8052ff,#ffb829

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
